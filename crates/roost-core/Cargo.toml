[package]
name = "roost-core"
version = "0.1.0"
description = "Hugging Face to Ollama import engine: Hugging Face and Ollama clients, the import pipeline, staging, settings, history and hardware fit estimates."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
directories = "6.0.0"
fs4 = "1.1.0"
futures-util = { version = "0.3.34", default-features = false }
keyring = "4.2.0"
nvml-wrapper = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sysinfo = "0.40.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
toml = "1.1.8"
uuid = { version = "1.28", features = ["v4", "serde"] }

cap-std = "4"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }
globset = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
